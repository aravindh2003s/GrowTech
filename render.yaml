# render.yaml
# This file automates the deployment of the backend Web Service on Render.
# Note: The database creation has been removed because you already have an active free database.
# You will manually link your existing database's URL via the Render dashboard.

services:
  - type: web
    name: growtech-backend
    env: node
    plan: free # Uses Render's free Web Service tier
    rootDir: backend # Tells Render the backend is in the 'backend' folder
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # sync: false tells Render to keep the value you manually enter in the dashboard
      - key: DATABASE_URL
        sync: false
        
      - key: PORT
        value: "5000"
      
      # Generates a secure, random string for your JWT tokens automatically
      - key: JWT_SECRET
        generateValue: true
      
      # Set your admin credentials directly in the Render Dashboard (not here!)
      - key: ADMIN_EMAIL
        sync: false
      
      - key: ADMIN_PASS
        sync: false
